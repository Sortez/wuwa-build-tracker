[package]
name = "wuwa-build-tracker"
version = "0.2.0"
description = "Wuthering Waves build planner"
authors = ["WuWa Build Tracker"]
edition = "2021"

# The library is what the binary (and mobile) targets link against.
[lib]
name = "wuwa_build_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
